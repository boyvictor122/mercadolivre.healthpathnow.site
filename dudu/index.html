<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Foto Completa</title>
    <style>
        /* Remove margens e garante que o fundo ocupe a tela toda */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000; /* Fundo preto para não ter bordas brancas vazias */
            overflow: hidden; /* Evita barras de rolagem */
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            /* Esta é a regra principal: faz a imagem caber na tela sem cortar */
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="images/foto.png" alt="Foto Completa">
    </div>

</body>
</html>
